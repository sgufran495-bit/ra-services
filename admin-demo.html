<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RA Services Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f8;color:#20313b;font-family:Arial,sans-serif}
.wrap{max-width:780px;margin:auto;padding:16px}
header{background:#063d51;color:white;padding:22px;border-radius:18px;margin-bottom:16px}
.card{background:white;border:1px solid #e0e7eb;border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px}
h2{font-size:18px}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ccd8de;border-radius:10px;font-size:15px}
textarea{min-height:75px}
button{border:0;border-radius:10px;padding:12px 16px;background:#08789b;color:white;font-weight:bold}
button:disabled{opacity:.5}
.secondary{background:#e8f1f4;color:#164b5e}
.danger{background:#fff0ef;color:#a52e27}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.status{font-size:13px;margin-top:10px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #eee}
#adminApp{display:none}
@media(max-width:440px){.row{grid-template-columns:1fr}.wrap{padding:10px}}
</style>
</head>
<body>
<main class="wrap">
<header>
<h1>RA Services — Admin Panel</h1>
<p>Website Settings & Diamond Packages</p>
</header>

<section class="card" id="loginBox">
<h2>Admin Login</h2>
<label>Email</label>
<input id="email" type="email" value="sgufran495@gmail.com">
<label>Password</label>
<input id="password" type="password" placeholder="Admin password">
<div class="actions"><button id="loginButton">Login</button></div>
<div class="status" id="loginStatus"></div>
</section>

<div id="adminApp">
<div class="actions" style="margin-bottom:14px">
<button class="danger" id="logoutButton">Logout</button>
</div>

<section class="card">
<h2>Website Settings</h2>
<label>Brand Name</label>
<input id="brand" placeholder="RA Services">
<label>Announcement</label>
<textarea id="announcement"></textarea>
<div class="row">
<div>
<label>WhatsApp Number</label>
<input id="whatsapp" placeholder="+91 7304704301">
</div>
<div>
<label>Call Number</label>
<input id="call" placeholder="+91 7304704301">
</div>
</div>
<label>IMO Group URL</label>
<input id="imo" type="url" placeholder="IMO invite link">
<div class="actions"><button id="saveSettings">Save Settings</button></div>
<div class="status" id="settingsStatus"></div>
</section>

<section class="card">
<h2 id="formTitle">Add Diamond Package</h2>
<div class="row">
<div>
<label>Diamond Quantity</label>
<input id="diamonds" type="number" min="1">
</div>
<div>
<label>Price (INR)</label>
<input id="price" type="number" min="0">
</div>
</div>
<div class="actions">
<button id="savePackage">Save Package</button>
<button class="secondary" id="cancel">Clear</button>
</div>
<div class="status" id="packageStatus"></div>
</section>

<section class="card">
<h2>Current Packages</h2>
<table>
<thead><tr><th>Diamonds</th><th>Price</th><th>Action</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient(
'https://xxnqggagisjrpeupudma.supabase.co',
'sb_publishable_lveUqOl5kDN6nnVTeLsRrg_RQxAe7rq'
);

const $=id=>document.getElementById(id);

const defaults=[
[10,30],[50,92],[100,176],[200,352],[300,528],
[500,880],[600,1056],[1000,1760],[2000,3520],
[3000,5280],[5000,8800],[10000,17500]
];

const defaultSettings={
brand:'RA Services',
announcement:'IMO Diamond Recharge',
whatsapp:'+91 7304704301',
call:'+91 7304704301',
imo:''
};

let settings={...defaultSettings};
let packages=defaults.map(([diamonds,price])=>({diamonds,price}));
let editing=null;

async function isAdmin(user){
const {data,error}=await client.from('admin_users')
.select('user_id').eq('user_id',user.id).maybeSingle();
if(error)throw error;
return !!data;
}

async function saveToDatabase(){
const payload={
site:settings,
packages:packages
};

const {error}=await client.from('site_settings')
.update({
settings:payload,
updated_at:new Date().toISOString()
})
.eq('id',1);

if(error)throw error;
}

function showSettings(){
Object.keys(defaultSettings).forEach(k=>{
$(k).value=settings[k]||'';
});
}

function render(){
$('rows').innerHTML='';

packages.sort((a,b)=>a.diamonds-b.diamonds).forEach((p,i)=>{
const tr=document.createElement('tr');
tr.innerHTML=
`<td>${p.diamonds}</td>
<td>₹${Number(p.price).toFixed(2)}</td>
<td>
<button class="secondary" data-edit="${i}">Edit</button>
<button class="danger" data-delete="${i}">Delete</button>
</td>`;
$('rows').appendChild(tr);
});
}

async function loadFromDatabase(){
$('settingsStatus').textContent='Database से डेटा लोड हो रहा है...';

const {data,error}=await client.from('site_settings')
.select('settings').eq('id',1).single();

if(error)throw error;

const saved=data.settings||{};

settings={...defaultSettings,...(saved.site||{})};

if(Array.isArray(saved.packages)){
packages=saved.packages;
}

showSettings();
render();

$('settingsStatus').textContent='Database से डेटा लोड हो गया।';
}

function showAdmin(){
$('loginBox').style.display='none';
$('adminApp').style.display='block';

loadFromDatabase().catch(e=>{
$('settingsStatus').textContent='डेटा लोड नहीं हुआ: '+e.message;
});
}

$('loginButton').onclick=async()=>{
const email=$('email').value.trim();
const password=$('password').value;

if(!email||!password){
$('loginStatus').textContent='Email और Password भरें।';
return;
}

$('loginButton').disabled=true;
$('loginStatus').textContent='Login हो रहा है...';

try{
const {data,error}=await client.auth.signInWithPassword({
email,password
});

if(error)throw error;

if(!await isAdmin(data.user)){
await client.auth.signOut();
throw new Error('इस अकाउंट को Admin अनुमति नहीं है।');
}

$('loginStatus').textContent='';
showAdmin();

}catch(e){
$('loginStatus').textContent='Login असफल: '+e.message;
}finally{
$('loginButton').disabled=false;
}
};

$('logoutButton').onclick=async()=>{
await client.auth.signOut();
$('password').value='';
$('adminApp').style.display='none';
$('loginBox').style.display='block';
};

$('saveSettings').onclick=async()=>{
$('saveSettings').disabled=true;
$('settingsStatus').textContent='सेव हो रहा है...';

settings={
brand:$('brand').value.trim()||'RA Services',
announcement:$('announcement').value.trim(),
whatsapp:$('whatsapp').value.trim(),
call:$('call').value.trim(),
imo:$('imo').value.trim()
};

try{
await saveToDatabase();
$('settingsStatus').textContent='Settings Supabase Database में सेव हो गईं।';
}catch(e){
$('settingsStatus').textContent='सेव नहीं हुआ: '+e.message;
}finally{
$('saveSettings').disabled=false;
}
};

$('savePackage').onclick=async()=>{
const diamonds=Number($('diamonds').value);
const price=Number($('price').value);

if(!Number.isInteger(diamonds)||diamonds<1||
!Number.isFinite(price)||price<0){
$('packageStatus').textContent='सही Quantity और Price भरें।';
return;
}

if(editing===null){
if(packages.some(p=>p.diamonds===diamonds)){
$('packageStatus').textContent='पैकेज पहले से मौजूद है।';
return;
}
packages.push({diamonds,price});
}else{
packages[editing]={diamonds,price};
editing=null;
}

$('savePackage').disabled=true;

try{
await saveToDatabase();

$('diamonds').value='';
$('price').value='';
$('formTitle').textContent='Add Diamond Package';
$('packageStatus').textContent='पैकेज Database में सेव हो गया।';
render();

}catch(e){
$('packageStatus').textContent='सेव नहीं हुआ: '+e.message;
}finally{
$('savePackage').disabled=false;
}
};

$('rows').onclick=async e=>{
const edit=e.target.dataset.edit;
const del=e.target.dataset.delete;

if(edit!==undefined){
editing=Number(edit);
const p=packages[editing];

$('diamonds').value=p.diamonds;
$('price').value=p.price;
$('formTitle').textContent='Edit Diamond Package';
}

if(del!==undefined&&confirm('पैकेज हटाना चाहते हैं?')){
const oldPackages=[...packages];
packages.splice(Number(del),1);

try{
await saveToDatabase();
render();
$('packageStatus').textContent='पैकेज हटा दिया गया।';
}catch(e){
packages=oldPackages;
render();
$('packageStatus').textContent='हटाया नहीं गया: '+e.message;
}
}
};

$('cancel').onclick=()=>{
editing=null;
$('diamonds').value='';
$('price').value='';
$('formTitle').textContent='Add Diamond Package';
$('packageStatus').textContent='';
};

async function start(){
const {data:{session}}=await client.auth.getSession();

if(!session)return;

try{
if(await isAdmin(session.user)){
showAdmin();
}else{
await client.auth.signOut();
}
}catch(e){
$('loginStatus').textContent='Admin जाँच में समस्या: '+e.message;
}
}

start();
</script>
</body>
</html>
